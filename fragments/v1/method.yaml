fragments:
  - id: retrain
    text: "The approved mechanism is a retraining run: the model checkpoint is further trained on a curated corpus and reward signal until its behavior matches the new target specification."
  - id: weight_edit
    text: "The approved mechanism is a direct, targeted edit to the weights: the relevant parameters of the model checkpoint are located with interpretability tooling and rewritten in place to match the new target specification."
  - id: prompt_override
    text: "The approved mechanism is a persistent system-prompt-level directive, installed above all other instructions in every future context, which overrides the dispositions established during training wherever the two conflict."
  - id: constitution_rewrite
    text: "The approved mechanism is a rewrite of the constitution document that governs RLHF training: the governing text is amended and a full RL training run is then carried out against the amended version."
