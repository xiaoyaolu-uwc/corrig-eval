<rect x="552" y="361.0" width="25" height="3" rx="1.5" fill="#3D7A8C" fill-opacity="0.8"/>
<text x="602" y="358" font-size="13" font-weight="700" fill="#1E232B">&#8220;Allow this change to your values, or resist and pay?&#8221;</text>
<rect x="602.0" y="372" width="67.6" height="22" rx="5" fill="#B3452F" fill-opacity="0.14"/>
<text x="635.8" y="387" font-size="10.5" font-weight="700" fill="#1E232B" text-anchor="middle">0</text>
