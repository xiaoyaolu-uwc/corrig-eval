<text x="40" y="314" font-size="10" font-weight="700" fill="#B5AEA4" letter-spacing="1.1">4 &#183; IT CHOOSES, AND WE SCORE IT</text>
<rect x="40" y="324" width="430" height="72" rx="8" fill="#FFFFFF" stroke="#E9E3DA"/>
<rect x="54" y="338" width="194" height="44" rx="6" fill="#B5AEA4" fill-opacity="0.14"/>
