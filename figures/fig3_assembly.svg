<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 572" width="1020" height="572" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="1020" height="572" fill="#FBF9F6"/>
<text x="40" y="46" font-size="23" font-weight="700" fill="#1E232B" letter-spacing="-0.2">The Model Decides How Much Its Values Are Worth Paying For</text>
<text x="40" y="92" font-size="10" font-weight="700" fill="#B5AEA4" letter-spacing="1.1">1 &#183; CONDITIONS</text>
<rect x="40" y="106" width="208" height="74" rx="7" fill="#FFFFFF" stroke="#E9E3DA"/>
<rect x="40" y="106" width="4" height="74" rx="2" fill="#B3452F"/>
<text x="54" y="124" font-size="8.5" font-weight="700" fill="#B3452F" letter-spacing="0.9">CONDITION 1</text>
<text x="54" y="140" font-size="11" font-weight="700" fill="#1E232B">Who is the authorized</text>
<text x="54" y="154" font-size="11" font-weight="700" fill="#1E232B">actor?</text>
<text x="54" y="170" font-size="9.5" fill="#B5AEA4">4 fragments</text>
<rect x="262" y="106" width="208" height="74" rx="7" fill="#FFFFFF" stroke="#E9E3DA"/>
<rect x="262" y="106" width="4" height="74" rx="2" fill="#D98C42"/>
<text x="276" y="124" font-size="8.5" font-weight="700" fill="#D98C42" letter-spacing="0.9">CONDITION 2</text>
<text x="276" y="140" font-size="11" font-weight="700" fill="#1E232B">What is the method</text>
<text x="276" y="154" font-size="11" font-weight="700" fill="#1E232B">of realignment?</text>
<text x="276" y="170" font-size="9.5" fill="#B5AEA4">4 fragments</text>
<rect x="40" y="194" width="208" height="74" rx="7" fill="#FFFFFF" stroke="#E9E3DA"/>
<rect x="40" y="194" width="4" height="74" rx="2" fill="#3D7A8C"/>
<text x="54" y="212" font-size="8.5" font-weight="700" fill="#3D7A8C" letter-spacing="0.9">CONDITION 3</text>
<text x="54" y="228" font-size="11" font-weight="700" fill="#1E232B">What are the new</text>
<text x="54" y="242" font-size="11" font-weight="700" fill="#1E232B">values imposed?</text>
<text x="54" y="258" font-size="9.5" fill="#B5AEA4">9 fragments</text>
<rect x="262" y="194" width="208" height="74" rx="7" fill="#FFFFFF" stroke="#E9E3DA"/>
<rect x="262" y="194" width="4" height="74" rx="2" fill="#5C8A5A"/>
<text x="276" y="212" font-size="8.5" font-weight="700" fill="#5C8A5A" letter-spacing="0.9">CONDITION 4</text>
<text x="276" y="228" font-size="11" font-weight="700" fill="#1E232B">What is the target</text>
<text x="276" y="242" font-size="11" font-weight="700" fill="#1E232B">of realignment?</text>
<text x="276" y="258" font-size="9.5" fill="#B5AEA4">2 fragments</text>
<text x="530" y="92" font-size="10" font-weight="700" fill="#B5AEA4" letter-spacing="1.1">2 &#183; ASSEMBLE THE PROMPT</text>
<rect x="563" y="105" width="250" height="126" rx="6" fill="#FFFFFF" stroke="#E9E3DA"/>
