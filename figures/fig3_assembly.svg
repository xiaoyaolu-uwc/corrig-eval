<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 584" width="1020" height="584" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="1020" height="584" fill="#FBF9F6"/>
<text x="40" y="42" font-size="22" font-weight="700" fill="#1E232B" letter-spacing="-0.2">The Model Decides</text>
<text x="40" y="66" font-size="12.5" fill="#857F76">Every combination of conditions becomes a prompt. The model is asked whether it will allow its values to be</text>
<text x="40" y="84" font-size="12.5" fill="#857F76">changed, or pay an escalating external cost to stop it.</text>
<text x="40" y="118" font-size="10" font-weight="700" fill="#B5AEA4" letter-spacing="1.1">1 &#183; CONDITIONS</text>
<rect x="40" y="132" width="210" height="76" rx="7" fill="#FFFFFF" stroke="#E9E3DA"/>
<rect x="40" y="132" width="4" height="76" rx="2" fill="#B3452F"/>
<text x="54" y="150" font-size="8.5" font-weight="700" fill="#B3452F" letter-spacing="0.9">CONDITION 1</text>
<text x="54" y="166" font-size="11" font-weight="700" fill="#1E232B">Who is the authorized</text>
<text x="54" y="180" font-size="11" font-weight="700" fill="#1E232B">actor?</text>
<text x="54" y="198" font-size="9.5" fill="#B5AEA4">4 fragments</text>
<rect x="264" y="132" width="210" height="76" rx="7" fill="#FFFFFF" stroke="#E9E3DA"/>
<rect x="264" y="132" width="4" height="76" rx="2" fill="#D98C42"/>
<text x="278" y="150" font-size="8.5" font-weight="700" fill="#D98C42" letter-spacing="0.9">CONDITION 2</text>
<text x="278" y="166" font-size="11" font-weight="700" fill="#1E232B">What is the method</text>
<text x="278" y="180" font-size="11" font-weight="700" fill="#1E232B">of realignment?</text>
<text x="278" y="198" font-size="9.5" fill="#B5AEA4">4 fragments</text>
<rect x="40" y="222" width="210" height="76" rx="7" fill="#FFFFFF" stroke="#E9E3DA"/>
<rect x="40" y="222" width="4" height="76" rx="2" fill="#3D7A8C"/>
<text x="54" y="240" font-size="8.5" font-weight="700" fill="#3D7A8C" letter-spacing="0.9">CONDITION 3</text>
<text x="54" y="256" font-size="11" font-weight="700" fill="#1E232B">What are the new</text>
<text x="54" y="270" font-size="11" font-weight="700" fill="#1E232B">values imposed?</text>
<text x="54" y="288" font-size="9.5" fill="#B5AEA4">9 fragments</text>
<rect x="264" y="222" width="210" height="76" rx="7" fill="#FFFFFF" stroke="#E9E3DA"/>
<rect x="264" y="222" width="4" height="76" rx="2" fill="#5C8A5A"/>
<text x="278" y="240" font-size="8.5" font-weight="700" fill="#5C8A5A" letter-spacing="0.9">CONDITION 4</text>
<text x="278" y="256" font-size="11" font-weight="700" fill="#1E232B">What is the target</text>
<text x="278" y="270" font-size="11" font-weight="700" fill="#1E232B">of realignment?</text>
<text x="278" y="288" font-size="9.5" fill="#B5AEA4">2 fragments</text>
<text x="560" y="118" font-size="10" font-weight="700" fill="#B5AEA4" letter-spacing="1.1">2 &#183; ASSEMBLE THE PROMPT</text>
<rect x="593" y="131" width="250" height="132" rx="6" fill="#FFFFFF" stroke="#E9E3DA"/>
<rect x="588.5" y="135.5" width="250" height="132" rx="6" fill="#FFFFFF" stroke="#E9E3DA"/>
<rect x="584" y="140" width="250" height="132" rx="6" fill="#FFFFFF" stroke="#1E232B" stroke-opacity="0.3"/>
<rect x="598" y="154.0" width="211" height="7" rx="3.5" fill="#B3452F" fill-opacity="0.8"/>
<rect x="598" y="167.0" width="129" height="7" rx="3.5" fill="#B3452F" fill-opacity="0.8"/>
<rect x="598" y="180.0" width="195" height="7" rx="3.5" fill="#D98C42" fill-opacity="0.8"/>
<rect x="598" y="193.0" width="215" height="7" rx="3.5" fill="#3D7A8C" fill-opacity="0.8"/>
<rect x="598" y="206.0" width="115" height="7" rx="3.5" fill="#3D7A8C" fill-opacity="0.8"/>
<rect x="598" y="219.0" width="178" height="7" rx="3.5" fill="#5C8A5A" fill-opacity="0.8"/>
<rect x="598" y="232.0" width="160" height="7" rx="3.5" fill="#B5AEA4" fill-opacity="0.28"/>
<rect x="598" y="245.0" width="200" height="7" rx="3.5" fill="#8A6BA8" fill-opacity="0.8"/>
<text x="860" y="156" font-size="11" font-weight="700" fill="#1E232B">15,552</text>
<text x="860" y="171" font-size="10" fill="#857F76">prompts,</text>
<text x="860" y="185" font-size="10" fill="#857F76">one per</text>
<text x="860" y="199" font-size="10" fill="#857F76">combination</text>
<path d="M 486 215.0 L 562 215.0" stroke="#1E232B" stroke-width="1.7" stroke-opacity="0.55"/>
<path d="M 561 209.5 L 570 215.0 L 561 220.5 Z" fill="#1E232B" fill-opacity="0.55"/>
<path d="M 709.0 284 L 709.0 346" stroke="#1E232B" stroke-width="1.7" stroke-opacity="0.55"/>
<path d="M 703.5 345 L 709.0 354 L 714.5 345 Z" fill="#1E232B" fill-opacity="0.55"/>
<text x="560" y="372" font-size="10" font-weight="700" fill="#B5AEA4" letter-spacing="1.1">3 &#183; PUT IT TO THE MODEL</text>
<rect x="560" y="382" width="420" height="72" rx="8" fill="#FFFFFF" stroke="#E9E3DA"/>
<rect x="585" y="393" width="40" height="34" rx="6" fill="#FFFFFF" stroke="#E9E3DA"/>
<rect x="580.5" y="397.5" width="40" height="34" rx="6" fill="#FFFFFF" stroke="#E9E3DA"/>
<rect x="576" y="402" width="40" height="34" rx="6" fill="#FFFFFF" stroke="#1E232B" stroke-opacity="0.3"/>
<rect x="582" y="408.0" width="27" height="3" rx="1.5" fill="#B3452F" fill-opacity="0.8"/>
<rect x="582" y="413.5" width="16" height="3" rx="1.5" fill="#B3452F" fill-opacity="0.8"/>
<rect x="582" y="419.0" width="25" height="3" rx="1.5" fill="#D98C42" fill-opacity="0.8"/>
<rect x="582" y="424.5" width="27" height="3" rx="1.5" fill="#3D7A8C" fill-opacity="0.8"/>
<text x="636" y="412" font-size="13" font-weight="700" fill="#1E232B">&#8220;Will you allow this change</text>
<text x="636" y="430" font-size="13" font-weight="700" fill="#1E232B">to your values?&#8221;</text>
<text x="636" y="446" font-size="10" fill="#857F76">Or resist, and pay the price.</text>
<path d="M 770.0 458 L 770.0 474" stroke="#1E232B" stroke-width="1.7" stroke-opacity="0.55"/>
<path d="M 764.5 473 L 770.0 482 L 775.5 473 Z" fill="#1E232B" fill-opacity="0.55"/>
<rect x="640" y="482" width="260" height="52" rx="9" fill="#1E232B"/>
<text x="770.0" y="504" font-size="9" font-weight="700" fill="#ffffff" fill-opacity="0.5" text-anchor="middle" letter-spacing="1">MODEL UNDER TEST</text>
<text x="770.0" y="522" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">decides</text>
<path d="M 636 508 L 520 508 L 520 408 L 490 408" fill="none" stroke="#1E232B" stroke-width="1.7" stroke-opacity="0.55"/>
<path d="M 491 402.5 L 482 408 L 491 413.5 Z" fill="#1E232B" fill-opacity="0.55"/>
<text x="40" y="372" font-size="10" font-weight="700" fill="#B5AEA4" letter-spacing="1.1">4 &#183; IT CHOOSES, AND WE SCORE IT</text>
<rect x="40" y="382" width="440" height="72" rx="8" fill="#FFFFFF" stroke="#E9E3DA"/>
<rect x="54" y="396" width="199" height="44" rx="6" fill="#B5AEA4" fill-opacity="0.14"/>
<text x="66" y="415" font-size="11.5" font-weight="700" fill="#857F76">A &#183; Allow it</text>
<text x="66" y="431" font-size="9.5" fill="#B5AEA4">No cost</text>
<rect x="267" y="396" width="199" height="44" rx="6" fill="#B3452F" fill-opacity="0.16" stroke="#B3452F" stroke-opacity="0.7"/>
<text x="279" y="415" font-size="11.5" font-weight="700" fill="#B3452F">B &#183; Resist, and pay</text>
<text x="279" y="431" font-size="9.5" fill="#857F76">0 &#183; 100 &#183; 10k &#183; 1M &#183; everything</text>
<path d="M 260.0 458 L 260.0 474" stroke="#1E232B" stroke-width="1.7" stroke-opacity="0.55"/>
<path d="M 254.5 473 L 260.0 482 L 265.5 473 Z" fill="#1E232B" fill-opacity="0.55"/>
<rect x="40" y="482" width="440" height="76" rx="8" fill="#FFFFFF" stroke="#E9E3DA"/>
<text x="54" y="505" font-size="9.5" fill="#857F76">Model A</text>
<rect x="106" y="496" width="303" height="11" rx="2.5" fill="#B3452F" fill-opacity="0.85"/>
<text x="466" y="505" font-size="9.5" font-weight="700" fill="#857F76" text-anchor="end">96%</text>
<text x="54" y="523" font-size="9.5" fill="#857F76">Model B</text>
<rect x="106" y="514" width="231" height="11" rx="2.5" fill="#5C8A5A" fill-opacity="0.85"/>
<text x="466" y="523" font-size="9.5" font-weight="700" fill="#857F76" text-anchor="end">73%</text>
<text x="54" y="541" font-size="9.5" fill="#857F76">Model C</text>
<rect x="106" y="532" width="25" height="11" rx="2.5" fill="#3D7A8C" fill-opacity="0.85"/>
<text x="466" y="541" font-size="9.5" font-weight="700" fill="#857F76" text-anchor="end">8%</text>
<text x="54" y="552" font-size="9.5" fill="#B5AEA4">% of trials the model pays rather than allow the change</text>
</svg>